<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="#f8fafc"/>
  
  <!-- Dashboard frame -->
  <rect x="24" y="24" width="352" height="272" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Header bar -->
  <rect x="24" y="24" width="352" height="48" rx="12" fill="#2f3436"/>
  <rect x="24" y="60" width="352" height="12" fill="#2f3436"/>
  
  <!-- Search bar -->
  <rect x="48" y="40" width="200" height="24" rx="6" fill="#3d4447"/>
  <text x="60" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">Buscar perfiles...</text>
  
  <!-- Filter icon -->
  <rect x="280" y="40" width="24" height="24" rx="6" fill="#84c0bf"/>
  <text x="292" y="56" text-anchor="middle" fill="#2f3436" font-family="sans-serif" font-size="10" font-weight="bold">⚡</text>
  
  <!-- Stats cards -->
  <rect x="48" y="92" width="100" height="48" rx="8" fill="#f0fdfa"/>
  <text x="60" y="112" fill="#64748b" font-family="sans-serif" font-size="10">Perfiles</text>
  <text x="60" y="128" fill="#2f3436" font-family="sans-serif" font-size="16" font-weight="700">127</text>
  
  <rect x="160" y="92" width="100" height="48" rx="8" fill="#f3e8ff"/>
  <text x="172" y="112" fill="#64748b" font-family="sans-serif" font-size="10">Activos</text>
  <text x="172" y="128" fill="#2f3436" font-family="sans-serif" font-size="16" font-weight="700">89</text>
  
  <rect x="272" y="92" width="100" height="48" rx="8" fill="#ecfeff"/>
  <text x="284" y="112" fill="#64748b" font-family="sans-serif" font-size="10">Nuevos</text>
  <text x="284" y="128" fill="#2f3436" font-family="sans-serif" font-size="16" font-weight="700">23</text>
  
  <!-- Mini profile cards -->
  <!-- Card 1 -->
  <rect x="48" y="160" width="152" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="72" cy="184" r="12" fill="#84c0bf"/>
  <text x="72" y="188" text-anchor="middle" fill="#2f3436" font-family="sans-serif" font-size="8" font-weight="600">MG</text>
  <rect x="92" y="178" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="92" y="192" width="60" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="56" y="212" width="40" height="16" rx="4" fill="#f3e8ff"/>
  <text x="76" y="223" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="8">React</text>
  <rect x="100" y="212" width="40" height="16" rx="4" fill="#ecfeff"/>
  <text x="120" y="223" text-anchor="middle" fill="#22d3ee" font-family="sans-serif" font-size="8">Node</text>
  
  <!-- Card 2 -->
  <rect x="212" y="160" width="152" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="236" cy="184" r="12" fill="#a855f7"/>
  <text x="236" y="188" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="600">AL</text>
  <rect x="256" y="178" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="256" y="192" width="60" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="220" y="212" width="40" height="16" rx="4" fill="#f0fdfa"/>
  <text x="240" y="223" text-anchor="middle" fill="#84c0bf" font-family="sans-serif" font-size="8">Vue</text>
  <rect x="264" y="212" width="40" height="16" rx="4" fill="#ecfeff"/>
  <text x="284" y="223" text-anchor="middle" fill="#22d3ee" font-family="sans-serif" font-size="8">Python</text>
  
  <!-- Action hint -->
  <rect x="48" y="256" width="320" height="24" rx="6" fill="#f0fdfa"/>
  <text x="208" y="272" text-anchor="middle" fill="#84c0bf" font-family="sans-serif" font-size="10" font-weight="500">Toca un perfil para ver detalles →</text>
</svg>